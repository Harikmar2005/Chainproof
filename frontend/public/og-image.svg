<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1428" />
      <stop offset="100%" stop-color="#080c1b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="cyberGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyberGlow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#cyberGlow)" />
  <rect width="1200" height="630" fill="url(#cyberGlow2)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Content: Logo & Text -->
  <g transform="translate(100, 120)">
    <!-- Badge -->
    <rect width="260" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="130" y="24" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">● AI-POWERED PLATFORM</text>

    <!-- Title -->
    <text x="0" y="110" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5">
      ChainProof
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="url(#primaryGrad)" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700">
      Container Security &amp; Supply-Chain AI
    </text>

    <!-- Description -->
    <text x="0" y="240" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400">
      Automated vulnerability discovery, SBOM generation, digital signature
    </text>
    <text x="0" y="272" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400">
      verification, and machine learning risk scoring in milliseconds.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 330)">
      <rect width="160" height="42" rx="8" fill="#151e33" stroke="#334155" />
      <text x="80" y="26" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Syft SBOM v1.0</text>

      <rect x="180" width="180" height="42" rx="8" fill="#151e33" stroke="#334155" />
      <text x="270" y="26" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Docker Scout SARIF</text>

      <rect x="380" width="180" height="42" rx="8" fill="#151e33" stroke="#334155" />
      <text x="470" y="26" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="600" text-anchor="middle">AI Random Forest</text>
    </g>
  </g>

  <!-- Right Graphic: 3D Shield -->
  <g transform="translate(860, 200)">
    <circle cx="100" cy="100" r="140" fill="#6366f1" fill-opacity="0.15" filter="blur(30px)" />
    <!-- Shield -->
    <path d="M100 10 L180 40 C180 120 100 190 100 190 C100 190 20 120 20 40 Z" 
          fill="url(#primaryGrad)" stroke="#818cf8" stroke-width="4" />
    <path d="M100 28 L160 52 C160 114 100 168 100 168 C100 168 40 114 40 52 Z" 
          fill="#0c1222" stroke="#38bdf8" stroke-width="3" />
    <path d="M85 98 L98 112 L125 78" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
