<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M50 5 L88 20 C88 55 50 92 50 92 C50 92 12 55 12 20 Z" 
        fill="url(#shieldGrad)" 
        stroke="#818cf8" 
        stroke-width="2" 
        filter="url(#glow)" />
        
  <!-- Inner Shield Core -->
  <path d="M50 14 L80 26 C80 52 50 82 50 82 C50 82 20 52 20 26 Z" 
        fill="#0b1020" 
        stroke="url(#innerGlow)" 
        stroke-width="2" />

  <!-- Chain / Blockchain Proof Link -->
  <circle cx="50" cy="38" r="7" fill="none" stroke="#38bdf8" stroke-width="3" />
  <circle cx="50" cy="58" r="7" fill="none" stroke="#a855f7" stroke-width="3" />
  <line x1="50" y1="45" x2="50" y2="51" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
  <path d="M43 48 L57 48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  
  <!-- Checkmark / Pulse Spark -->
  <path d="M42 48 L48 54 L60 40" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
