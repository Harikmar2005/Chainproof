[package]
name = "chainproof-desktop"
version = "2.0.0"
description = "ChainProof Cross-Platform Container Security Platform Desktop Client"
authors = ["ChainProof Security Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "notification", "dialog", "http-all", "fs-all", "path-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
